<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes float-slow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    
    .animated-circle { transform-origin: 1000px 175px; animation: pulse 6s infinite ease-in-out; }
    .animated-card { animation: float-slow 4s infinite ease-in-out; }
    .chart-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic/Animated Background Graphics (Behind text) -->
  <circle class="animated-circle" cx="1000" cy="175" r="140" fill="url(#accent-grad)" opacity="0.15" filter="blur(30px)"/>
  <circle cx="150" cy="80" r="100" fill="#38bdf8" opacity="0.08" filter="blur(40px)"/>

  <!-- Background Grid & Chart Lines -->
  <path d="M0,280 Q 300,240 600,290 T 1200,220" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.3" class="chart-line"/>
  <path d="M0,310 Q 400,270 800,320 T 1200,260" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.2"/>

  <!-- Floating Visual Graphic Card on Right Side (Kept away from text) -->
  <g class="animated-card" transform="translate(820, 65)">
    <rect width="310" height="220" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    
    <!-- Mini Graphic Elements -->
    <text x="24" y="45" font-family="sans-serif" font-weight="700" font-size="16" fill="#f8fafc">🚀 UA Attribution Funnel</text>
    
    <!-- Bar chart simulation -->
    <rect x="24" y="140" width="36" height="50" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="76" y="110" width="36" height="80" rx="4" fill="#818cf8" opacity="0.8"/>
    <rect x="128" y="85" width="36" height="105" rx="4" fill="#c084fc" opacity="0.8"/>
    <rect x="180" y="125" width="36" height="65" rx="4" fill="#f472b6" opacity="0.8"/>
    <rect x="232" y="95" width="36" height="95" rx="4" fill="#34d399" opacity="0.8"/>

    <path d="M 42,130 L 94,100 L 146,75 L 198,115 L 250,85" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Foreground Content: Header & Titles (Guaranteed clear visibility) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 65)">
      <rect width="260" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="21" class="badge-text">🎮 GAME USER ACQUISITION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" class="title">Awesome Game User Acquisition 🎯</text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">Curated SaaS Platforms, MMPs, Attribution Suites &amp; Open-Source Tools</text>
    <text x="0" y="235" font-family="sans-serif" font-weight="400" font-size="16" fill="#64748b">Scale app installs, measure ROAS, track SKAN events &amp; prevent ad fraud</text>

    <!-- Decorative Accent Line -->
    <rect x="0" y="270" width="480" height="4" rx="2" fill="url(#accent-grad)"/>
  </g>
</svg>
